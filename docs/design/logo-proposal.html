<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiram · Proposta de lockup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#0A1428;color:#E8ECF4}
.row{display:grid;grid-template-columns:1fr 1fr}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px;gap:36px;min-height:46vh}
.dark{background:#0A1428;color:#C9A227}
.light{background:#F8F7F4;color:#1B3A6B}
.lockup{display:flex;flex-direction:column;align-items:center;gap:26px}
.lockup svg{width:88px;height:88px}
.word{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:26px;letter-spacing:.32em;text-transform:uppercase;text-indent:.32em}
.dark .word{color:#E8ECF4}
.light .word{color:#1C2433}
.tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;font-family:'Space Grotesk',sans-serif}
.dark .tag{color:#94A3BD}
.light .tag{color:#6B675D}
@media (max-width:680px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="row">
  <div class="cell dark">
    <span class="tag">Contorno · linha fina</span>
    <div class="lockup">
      <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3.5"><rect x="21" y="17" width="11" height="62" rx="1.5"/><rect x="64" y="17" width="11" height="62" rx="1.5"/><rect x="35.5" y="37.5" width="25" height="8" rx="1.5"/><g fill="currentColor" stroke="none"><circle cx="48" cy="58" r="3.4"/><circle cx="41" cy="69" r="3.4"/><circle cx="55" cy="69" r="3.4"/></g></svg>
      <span class="word">Hiram&#8756;</span>
    </div>
  </div>
  <div class="cell dark">
    <span class="tag">Sólido · lapidar</span>
    <div class="lockup">
      <svg viewBox="0 0 96 96" fill="currentColor"><rect x="20" y="16" width="12" height="64" rx="2"/><rect x="64" y="16" width="12" height="64" rx="2"/><rect x="32" y="36" width="32" height="11" rx="2"/><circle cx="48" cy="57" r="4.2"/><circle cx="40" cy="69" r="4.2"/><circle cx="56" cy="69" r="4.2"/></svg>
      <span class="word">Hiram&#8756;</span>
    </div>
  </div>
</div>

<div class="row">
  <div class="cell light">
    <span class="tag">Contorno sobre pedra</span>
    <div class="lockup">
      <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3.5"><rect x="21" y="17" width="11" height="62" rx="1.5"/><rect x="64" y="17" width="11" height="62" rx="1.5"/><rect x="35.5" y="37.5" width="25" height="8" rx="1.5"/><g fill="currentColor" stroke="none"><circle cx="48" cy="58" r="3.4"/><circle cx="41" cy="69" r="3.4"/><circle cx="55" cy="69" r="3.4"/></g></svg>
      <span class="word">Hiram&#8756;</span>
    </div>
  </div>
  <div class="cell light">
    <span class="tag">Sólido sobre pedra</span>
    <div class="lockup">
      <svg viewBox="0 0 96 96" fill="currentColor"><rect x="20" y="16" width="12" height="64" rx="2"/><rect x="64" y="16" width="12" height="64" rx="2"/><rect x="32" y="36" width="32" height="11" rx="2"/><circle cx="48" cy="57" r="4.2"/><circle cx="40" cy="69" r="4.2"/><circle cx="56" cy="69" r="4.2"/></svg>
      <span class="word">Hiram&#8756;</span>
    </div>
  </div>
</div>

</body>
</html>
