name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hiram.sln

      # Release turns warnings into errors, so this step doubles as the warning gate.
      - name: Build
        run: dotnet build Hiram.sln --configuration Release --no-restore

      # Testcontainers talks to the Docker engine preinstalled on the runner.
      - name: Test
        run: dotnet test Hiram.sln --configuration Release --no-build --verbosity normal

  docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate reference Compose
        run: docker compose -f docker-compose.dev.yml config

      - name: Verify backup and restore
        run: bash deploy/dr/verify-backup.sh

      # Pull requests stop at the build (the Dockerfile must publish cleanly, warnings as errors);
      # pushes to main also publish to GHCR tagged with the commit sha, so every deploy is traceable
      # to the exact commit, plus a moving latest.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Hiram image
        run: >
          docker build -f src/Hiram.Api/Dockerfile
          -t ghcr.io/${{ github.repository }}:${{ github.sha }}
          -t ghcr.io/${{ github.repository }}:latest .

      - name: Push images
        if: github.event_name == 'push'
        run: docker push --all-tags ghcr.io/${{ github.repository }}
