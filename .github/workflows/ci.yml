name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hiram.sln

      # Release turns warnings into errors, so this step doubles as the warning gate.
      - name: Build
        run: dotnet build Hiram.sln --configuration Release --no-restore

      # Testcontainers talks to the Docker engine preinstalled on the runner.
      - name: Test
        run: dotnet test Hiram.sln --configuration Release --no-build --verbosity normal

  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds prove the Dockerfiles publish cleanly; the build stage runs the same Release publish
      # (warnings as errors) the test job does.
      - name: Build api image
        run: docker build -f src/Hiram.Api/Dockerfile -t hiram-api:ci .

      - name: Build dispatcher image
        run: docker build -f src/Hiram.Dispatcher/Dockerfile -t hiram-dispatcher:ci .

  deploy-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Syntax gate for the deploy artifacts. Full k3s apply is a live/operator step, not CI.
      - name: Validate deploy manifests are well-formed YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('deploy/**/*.yaml', recursive=True) + glob.glob('deploy/**/*.yml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
