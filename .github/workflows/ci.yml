name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hiram.sln

      # Release turns warnings into errors, so this step doubles as the warning gate.
      - name: Build
        run: dotnet build Hiram.sln --configuration Release --no-restore

      # Testcontainers talks to the Docker engine preinstalled on the runner.
      - name: Test
        run: dotnet test Hiram.sln --configuration Release --no-build --verbosity normal

  docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests stop at the build (the Dockerfiles must publish cleanly, warnings as errors);
      # pushes to main also publish to GHCR tagged with the commit sha, so every deploy is traceable
      # to the exact commit, plus a moving latest.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build api image
        run: >
          docker build -f src/Hiram.Api/Dockerfile
          -t ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          -t ghcr.io/${{ github.repository }}-api:latest .

      - name: Build dispatcher image
        run: >
          docker build -f src/Hiram.Dispatcher/Dockerfile
          -t ghcr.io/${{ github.repository }}-dispatcher:${{ github.sha }}
          -t ghcr.io/${{ github.repository }}-dispatcher:latest .

      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push --all-tags ghcr.io/${{ github.repository }}-api
          docker push --all-tags ghcr.io/${{ github.repository }}-dispatcher

  deploy-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Syntax gate for the deploy artifacts. Full k3s apply is a live/operator step, not CI.
      - name: Validate deploy manifests are well-formed YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('deploy/**/*.yaml', recursive=True) + glob.glob('deploy/**/*.yml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  print(f"FAIL {f}: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      # There is no local Docker to render the joint stack, so the first real interpolation of the
      # compose file used to be the cutover itself. This renders it in CI for both env shapes (dev
      # default -> mailpit, and prod -> resend), catching a missing default or an empty required var.
      - name: Validate the joint stack compose renders (dev and prod env)
        run: |
          set -euo pipefail
          make_env() {
            {
              echo "HIRAM_ADMIN_KEY=ci-dummy"
              echo "POSTGRES_PASSWORD=ci-dummy"
              echo "RABBITMQ_PASSWORD=ci-dummy"
              echo "MONGO_CONNECTION_STRING=ci-dummy"
              echo "HIRAM_LEVANTE_API_KEY=ci-dummy"
              echo "LEVANTE_JWT_SECRET=ci-dummy-value-at-least-32-characters-xx"
              echo "LEVANTE_ORIGEM_HASH_SECRET=ci-dummy-value-at-least-32-chars"
              echo "LEVANTE_ADMIN_EMAIL=admin@ci.example"
              echo "LEVANTE_ADMIN_SENHA=ci-dummy"
              echo "SITE_HOST=ci.example"
              echo "SITE_URL=https://ci.example"
              echo "ACME_EMAIL=ops@ci.example"
              echo "MAIL_FROM=no-reply@ci.example"
            }
          }
          make_env > dev.env
          docker compose --env-file dev.env -f deploy/stack/docker-compose.yml config -q
          { make_env; echo "HIRAM_EMAIL_PROVIDER=resend"; echo "HIRAM_EMAIL_SECRET=ci-dummy"; } > prod.env
          docker compose --env-file prod.env -f deploy/stack/docker-compose.yml config -q
          rm -f dev.env prod.env
          echo "joint stack compose renders for the dev and prod env shapes"

      # The opt-in self-hosted MTA (ADR-026) is a standalone compose that escapes the joint-stack render
      # above, so validate its profile explicitly with dummy env, or a broken var would only surface on
      # the deploy host.
      - name: Validate the self-hosted MTA compose renders (mta profile)
        run: |
          set -euo pipefail
          cat > deploy/mta/mta.ci.env <<'EOF'
          STALWART_TAG=latest
          MTA_HOSTNAME=mta.ci.example
          MTA_SENDING_DOMAIN=ci.example
          MTA_DKIM_SELECTOR=hiram
          MTA_SUBMISSION_SECRET=ci-dummy
          MTA_RELAY_HOST=relay.ci.example
          MTA_RELAY_USERNAME=ci-dummy
          MTA_RELAY_PASSWORD=ci-dummy
          EOF
          docker compose --env-file deploy/mta/mta.ci.env -f deploy/mta/docker-compose.mta.yml --profile mta config -q
          rm -f deploy/mta/mta.ci.env
          echo "mta compose renders for the mta profile"
