name: hiram

services:
  postgres:
    image: postgres:17
    container_name: hiram-postgres
    environment:
      POSTGRES_USER: hiram
      POSTGRES_PASSWORD: hiram
      POSTGRES_DB: hiram
    # Host 5433 to avoid clashing with another Postgres already bound to 5432 on this machine.
    ports:
      - "5433:5432"
    volumes:
      - hiram-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiram -d hiram"]
      interval: 5s
      timeout: 3s
      retries: 10

  hiram:
    build:
      context: .
      dockerfile: src/Hiram.Api/Dockerfile
    container_name: hiram
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Hiram: "Host=postgres;Port=5432;Database=hiram;Username=hiram;Password=hiram"
      Hiram__AdminKey: ${HIRAM_ADMIN_KEY:-admin-dev-local}
      Hiram__MigrateOnStartup: "true"
      Hiram__Workers__Enabled: "true"
      Hiram__Email__Platform__Provider: "smtp"
      Hiram__Email__Platform__Settings__host: "mailpit"
      Hiram__Email__Platform__Settings__port: "1025"
      Hiram__Email__Platform__Settings__from: "no-reply@hiram.dev"
      Hiram__Email__Platform__Settings__security: "none"
      DataProtection__KeysPath: "/var/hiram/dataprotection-keys"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    ports:
      - "3357:8080"
    volumes:
      - ./site:/site:ro
      - hiram-keyring:/var/hiram/dataprotection-keys
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Mailpit is the local SMTP sink: the dev SMTP provider delivers here and the messages show up in the UI.
  mailpit:
    image: axllent/mailpit:latest
    container_name: hiram-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: hiram-aspire
    # Anonymous access so local apps can export OTLP and the UI opens without a login token.
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    # 18888 is the dashboard UI. Host 4317 maps to the container OTLP gRPC port (18889)
    # so the hosts can export to the conventional http://localhost:4317.
    ports:
      - "18888:18888"
      - "4317:18889"

volumes:
  hiram-pgdata:
  hiram-keyring:
