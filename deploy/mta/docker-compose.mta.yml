# Self-hosted MTA for Hiram (ADR-026): Stalwart as an outbound submission relay, opt-in via the "mta"
# profile so it stays dormant until explicitly enabled. Nothing here changes runtime until the
# dispatcher's Hiram__Email__Platform__Settings point at this service. Port 25 is never used: the last
# hop leaves through an authenticated smarthost on 587 (outbound 25 is blocked on Azure and in Brazil).
#
# Copy .env.mta.example to .env in this directory and fill it in. Generate the DKIM key into
# ./stalwart/dkim/hiram.key (git-ignored) before enabling. See README.md.
name: hiram-mta

services:
  stalwart:
    # Pin a tested tag in .env; verify the current image coordinates at hub.docker.com/r/stalwartlabs.
    image: stalwartlabs/mail-server:${STALWART_TAG:-latest}
    # Dormant until you run with `--profile mta`, so this file is inert in the default stack.
    profiles: ["mta"]
    environment:
      MTA_HOSTNAME: ${MTA_HOSTNAME:?set in .env}
      MTA_SENDING_DOMAIN: ${MTA_SENDING_DOMAIN:?set in .env}
      MTA_DKIM_SELECTOR: ${MTA_DKIM_SELECTOR:-hiram}
      MTA_SUBMISSION_SECRET: ${MTA_SUBMISSION_SECRET:?set in .env}
      MTA_RELAY_HOST: ${MTA_RELAY_HOST:?set in .env}
      MTA_RELAY_USERNAME: ${MTA_RELAY_USERNAME:?set in .env}
      MTA_RELAY_PASSWORD: ${MTA_RELAY_PASSWORD:?set in .env}
    volumes:
      # Config is read-only; adjust the in-image config path to the pinned version's layout (see README).
      - ./stalwart/config.toml:/opt/stalwart/etc/config.toml:ro
      # DKIM private key mounted read-only, never baked into the image or committed.
      - ./stalwart/dkim:/opt/stalwart/dkim:ro
      - stalwart-data:/opt/stalwart/data
    # Submission stays on the internal network; the dispatcher reaches it as "stalwart:587". No ports
    # are published to the host and port 25 is never bound. See README for attaching the Hiram network.
    restart: unless-stopped

volumes:
  stalwart-data:
