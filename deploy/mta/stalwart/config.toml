# Stalwart MTA for Hiram (ADR-026): outbound-only submission relay. The Hiram dispatcher submits on the
# internal network; Stalwart signs DKIM for the sending domain and forwards every message through an
# authenticated smarthost on port 587 (outbound 25 is blocked on Azure and in Brazil).
#
# Secrets never live in this file: relay and submission credentials come from the environment
# (%{env:...}%) and the DKIM private key is mounted read-only as a file (%{file:...}%). This template
# follows the current Stalwart configuration model; align the section keys and the in-image paths with
# the schema of the pinned Stalwart version before enabling (see README.md and the Stalwart docs).

[server]
# The EHLO name Stalwart presents. Must match the forward and reverse DNS (PTR) of the sending host.
hostname = "%{env:MTA_HOSTNAME}%"

[server.listener."submission"]
# The Hiram dispatcher connects here. Kept on the internal Docker network, never published to the host.
bind = ["[::]:587"]
protocol = "smtp"
tls.implicit = false

[session.auth]
# The dispatcher authenticates before it can submit; no anonymous relay.
mechanisms = ["PLAIN", "LOGIN"]
directory = "internal"

[directory."internal".principals.dispatcher]
class = "individual"
secret = "%{env:MTA_SUBMISSION_SECRET}%"

# DKIM signing for the sending domain. RSA-2048 for broad receiver compatibility; the private key is
# mounted read-only and never committed. Add a second ed25519 selector later if desired.
[signature."hiram"]
private-key = "%{file:/opt/stalwart/dkim/hiram.key}%"
domain = "%{env:MTA_SENDING_DOMAIN}%"
selector = "%{env:MTA_DKIM_SELECTOR}%"
canonicalization = "relaxed/relaxed"
algorithm = "rsa-sha256"

[auth.dkim.sign]
# Sign every outbound message with the signature above so DMARC can align on the From domain.
"*" = ["hiram"]

# The relay: every message leaves through the authenticated smarthost on 587. This is the only hop
# where a third party touches the mail; Stalwart owns queueing, signing and retries up to here.
[queue.outbound]
next-hop = "relay"

[remote."relay"]
address = "%{env:MTA_RELAY_HOST}%"
port = 587
protocol = "smtp"
# STARTTLS with certificate validation on: the relay must present a valid certificate.
tls.implicit = false
tls.allow-invalid-certs = false

[remote."relay".auth]
username = "%{env:MTA_RELAY_USERNAME}%"
secret = "%{env:MTA_RELAY_PASSWORD}%"
