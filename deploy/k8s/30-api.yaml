# ADR-016 / step 0.9: the api. Readiness gates on Postgres and Redis; liveness only checks the process.
# Both pods (api and dispatcher) share the key ring volume on the single node, with fsGroup making it
# writable. requests and limits on every pod keep the VM memory budget bounded (ADR-016).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiram-api
  namespace: hiram
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hiram-api
  template:
    metadata:
      labels:
        app: hiram-api
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: hiram-api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hiram-config
            - secretRef:
                name: hiram-secrets
          volumeMounts:
            - name: keyring
              mountPath: /var/hiram/dataprotection-keys
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "1000m"
              memory: "384Mi"
      volumes:
        - name: keyring
          persistentVolumeClaim:
            claimName: hiram-keyring
---
apiVersion: v1
kind: Service
metadata:
  name: hiram-api
  namespace: hiram
spec:
  selector:
    app: hiram-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Edge routing is environment specific: the EasyStok Caddy can proxy to this ingress, or k3s Traefik
# terminates it directly. Host and TLS are placeholders to fill against the real environment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hiram-api
  namespace: hiram
spec:
  rules:
    - host: notifications.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hiram-api
                port:
                  number: 80
