# ADR-016 / step 0.4 + 0.9: schema migration runs as a Job before promoting the api, never on a serving
# replica. Re-running is safe: migrations are idempotent and applying an up-to-date schema is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: hiram-migrate
  namespace: hiram
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: hiram-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: hiram-api:latest
          args: ["--migrate-only"]
          envFrom:
            - configMapRef:
                name: hiram-config
            - secretRef:
                name: hiram-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
