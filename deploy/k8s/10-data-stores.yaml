# ADR-016 / step 0.9: in-cluster data stores. Postgres is NOT here: it is the shared EasyStok server,
# reached through PgBouncer. RabbitMQ is persistent (DLQ and replay state); Redis is ephemeral (the
# idempotency fast-path is backstopped by the Postgres unique index).

# Shared Data Protection key ring. On single-node k3s both api and dispatcher pods land on the one node
# and share this ReadWriteOnce volume; fsGroup on the pods makes it writable. The api encrypts tenant
# secrets the dispatcher must decrypt, so this volume MUST be backed up (see deploy/dr).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hiram-keyring
  namespace: hiram
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: hiram
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: hiram
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: hiram }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: hiram-secrets, key: Hiram__AdminKey }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: hiram
spec:
  selector:
    app: rabbitmq
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hiram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hiram
spec:
  selector:
    app: redis
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
# PgBouncer dedicated to Hiram. The pgbouncer.ini and userlist.txt are created as a secret out of band
# from deploy/pgbouncer (they carry the auth hash). Mounted read-only here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: hiram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - { name: pgbouncer, containerPort: 6432 }
          volumeMounts:
            - { name: config, mountPath: /etc/pgbouncer, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
      volumes:
        - name: config
          secret:
            secretName: pgbouncer-config
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: hiram
spec:
  selector:
    app: pgbouncer
  ports:
    - { name: pgbouncer, port: 6432, targetPort: 6432 }
