# Joint VM stack: Levante (blog, .NET + MongoDB + Next) and Hiram (notifications, .NET + Postgres)
# running together, with Levante emitting events to Hiram over POST /v1/events and Hiram delivering
# email to Mailpit. Unified observability via a single OTLP collector (grafana/otel-lgtm).
#
# Only Caddy (80/443) is public; management UIs bind to 127.0.0.1 (reach them over an SSH tunnel).
# Copy .env.example to .env and fill it in. Images come from GHCR (published by each repo's CI); a
# commented build section per Levante image is the local-build escape hatch.
name: levante-hiram

services:
  # Limites de memoria abaixo sao PLACEHOLDERS de OOM (evitar que um pico do Levante mate os data
  # stores do Hiram). TODO(infra): ajustar a RAM real da VM. Ver Levante docs/adr/0003.

  # --- Data stores ---
  # Mongo do Levante NAO roda aqui: e externo (Atlas, replica set, usuario de privilegio minimo).
  # O IP publico da VM entra no allowlist do Atlas. O outbox transacional exige replica set (Atlas
  # entrega); GravadorDeAgregadoMongo so usa a transacao quando hello reporta setName.

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hiram
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: hiram
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiram -d hiram"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: hiram
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_WEBROOT: /mailpit
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
    restart: unless-stopped

  # --- Observability: one OTLP collector for both apps (traces, metrics, logs) ---
  # Backend unico de observabilidade (Levante ADR 0003: mantido no lugar de App Insights). Agrega
  # Grafana+Tempo+Loki+Prometheus, o maior consumidor de RAM da VM. O limite e PLACEHOLDER: subir se
  # der OOM (o backend nao pode morrer sob carga). TODO(infra): ajustar a RAM real da VM.
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3000:3000"   # Grafana (tunnel only)
    volumes:
      - lgtmdata:/data
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  # --- Hiram (notifications) ---
  keyring-init:
    image: busybox:1.37
    command: ["chown", "-R", "1654:1654", "/keys"]
    volumes:
      - keyring:/keys
    restart: "no"

  hiram-migrate:
    image: ghcr.io/michel-az-de/hiram-api:${HIRAM_IMAGE_TAG:-latest}
    command: ["--migrate-only"]
    environment:
      ConnectionStrings__Hiram: "Host=postgres;Port=5432;Database=hiram;Username=hiram;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      OTEL_SDK_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hiram-api:
    image: ghcr.io/michel-az-de/hiram-api:${HIRAM_IMAGE_TAG:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Hiram: "Host=postgres;Port=5432;Database=hiram;Username=hiram;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Hiram__AdminKey: ${HIRAM_ADMIN_KEY:?set in .env}
      Hiram__MigrateOnStartup: "false"
      DataProtection__KeysPath: "/var/hiram/dataprotection-keys"
      Hiram__Push__Vapid__Subject: ${VAPID_SUBJECT:-mailto:ops@example.com}
      Hiram__Push__Vapid__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Hiram__Push__Vapid__PrivateKey: ${VAPID_PRIVATE_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4317"
      OTEL_SERVICE_NAME: "hiram-api"
    # Bound to loopback only: Caddy never proxies Hiram to the public edge (the browser talks to
    # levante-web, which reaches Hiram in-network). Admin and provisioning run over an SSH tunnel to
    # this port, so /v1/admin (X-Admin-Key) is never publicly reachable.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keyring:/var/hiram/dataprotection-keys
    depends_on:
      hiram-migrate:
        condition: service_completed_successfully
      keyring-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      lgtm:
        condition: service_started
    restart: unless-stopped

  hiram-dispatcher:
    image: ghcr.io/michel-az-de/hiram-dispatcher:${HIRAM_IMAGE_TAG:-latest}
    environment:
      ConnectionStrings__Hiram: "Host=postgres;Port=5432;Database=hiram;Username=hiram;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__RabbitMq: "amqp://hiram:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      DataProtection__KeysPath: "/var/hiram/dataprotection-keys"
      # Email provider is env driven with safe defaults: dev and the interim host stay on
      # smtp -> mailpit (captures, no external delivery). For real delivery set
      # HIRAM_EMAIL_PROVIDER=resend + HIRAM_EMAIL_SECRET (the Resend API key) + MAIL_FROM
      # (a verified sender domain). The resend provider reads Settings__from and Secret;
      # the smtp Settings below are ignored when the provider is resend.
      Hiram__Email__Platform__Provider: ${HIRAM_EMAIL_PROVIDER:-smtp}
      Hiram__Email__Platform__Secret: ${HIRAM_EMAIL_SECRET:-}
      # The smtp provider reads lowercase setting keys and the dictionary is case sensitive.
      Hiram__Email__Platform__Settings__host: ${HIRAM_EMAIL_SMTP_HOST:-mailpit}
      Hiram__Email__Platform__Settings__port: ${HIRAM_EMAIL_SMTP_PORT:-1025}
      Hiram__Email__Platform__Settings__from: ${MAIL_FROM:-no-reply@levante.local}
      Hiram__Email__Platform__Settings__security: ${HIRAM_EMAIL_SMTP_SECURITY:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4317"
      OTEL_SERVICE_NAME: "hiram-dispatcher"
    volumes:
      - keyring:/var/hiram/dataprotection-keys
    depends_on:
      hiram-migrate:
        condition: service_completed_successfully
      keyring-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      lgtm:
        condition: service_started
    restart: unless-stopped

  # --- Levante (blog + emitter) ---
  levante-api:
    image: ghcr.io/michel-az-de/levante-api:${LEVANTE_IMAGE_TAG:-latest}
    # Local-build escape hatch (set LEVANTE_IMAGE_TAG=local and uncomment):
    # build:
    #   context: ../../../levante
    #   dockerfile: src/api/host/Levante.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Kestrel__Endpoints__Http__Url: "http://+:8080"
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING:?set in .env (Atlas srv URI, usuario de privilegio minimo)}
      Mongo__DatabaseName: "levante"
      Outbox__RelayHabilitado: "true"
      Hiram__BaseUrl: "http://hiram-api:8080"
      Hiram__ApiKey: ${HIRAM_LEVANTE_API_KEY:?run provision-levante.sh, then set in .env}
      Levante__Notificacoes__AdminEmail: ${LEVANTE_ADMIN_NOTIFICACOES_EMAIL:-moderacao@levante.local}
      Levante__Notificacoes__SiteUrl: ${SITE_URL:?set in .env}
      Jwt__SecretKey: ${LEVANTE_JWT_SECRET:?set in .env}
      Admin__Email: ${LEVANTE_ADMIN_EMAIL:?set in .env}
      Admin__SenhaInicial: ${LEVANTE_ADMIN_SENHA:?set in .env}
      # Cria o primeiro admin no boot a partir do .env (o codigo do Levante exige este opt-in em Producao).
      Admin__PermitirSeedEmProducao: "true"
      Engajamento__OrigemHashSecret: ${LEVANTE_ORIGEM_HASH_SECRET:?set in .env}
      Cors__Origens__0: ${SITE_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4317"
      OTEL_SERVICE_NAME: "levante-api"
    # Single replica: the outbox relay has no lease; Hiram's eventId idempotency makes a concurrent
    # POST safe, but scaling past 1 would need a lease first (see docs/adr/0002).
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    depends_on:
      hiram-api:
        condition: service_started
      lgtm:
        condition: service_started
    restart: unless-stopped

  levante-web:
    image: ghcr.io/michel-az-de/levante-web:${LEVANTE_IMAGE_TAG:-latest}
    # Local-build escape hatch (set LEVANTE_IMAGE_TAG=local and uncomment):
    # build:
    #   context: ../../../levante/src/web
    #   dockerfile: Dockerfile
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      API_BASE_URL: "http://levante-api:8080"
      # Sem SITE_URL o container falha no boot (fail-fast em instrumentation.ts): alimenta
      # canonical/sitemap/RSS/OG/JSON-LD. Nao deixar cair em localhost.
      SITE_URL: ${SITE_URL:?set in .env}
      # Flags de cutover D0 lidas em runtime pelo web (src/web/src/lib/flags.ts). Default off: o host
      # provisorio nao indexa e a newsletter espera o dominio Resend verificado. Ligar no D0 e recriar.
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      levante-api:
        condition: service_started
    restart: unless-stopped

  # --- Edge ---
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - levante-web
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmqdata:
  keyring:
  lgtmdata:
  caddy-data:
  caddy-config:
