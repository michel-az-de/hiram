;; ADR-016 / step 0.8: PgBouncer dedicated to Hiram. Only Hiram connections traverse this pooler; the
;; EasyStok data path is untouched. Transaction pooling multiplexes many app connections onto a small
;; server-side pool, so the Dispatcher can scale (KEDA) without growing physical Postgres connections.
;; The EasyStok outbox uses session advisory locks, which transaction pooling breaks, so the ERP must
;; never be put behind this pooler.

[databases]
hiram = host=POSTGRES_HOST port=5432 dbname=hiram

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction

;; Server-side pool to Postgres. This is Hiram's physical footprint on the shared server, independent of
;; how many Dispatcher replicas KEDA spins up. Keep within the connection budget (see connection-budget.md).
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Client side: many app connections are fine; they queue for a server slot.
max_client_conn = 200

server_idle_timeout = 300
;; Transaction mode does not run a per-checkout reset query; leave the default behaviour.
ignore_startup_parameters = extra_float_digits
